<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Certificados | Empresa</title>
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F9FAFB;
            --text-color: #111827;
            --success: #10B981;
            --error: #EF4444;
            --warning: #F59E0B;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p {
            color: #6B7280;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .upload-area {
            border: 2px dashed #E5E7EB;
            border-radius: 8px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background-color: #EEF2FF;
        }

        #fileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 2rem;
            color: #9CA3AF;
            margin-bottom: 1rem;
            display: block;
        }

        .button {
            margin-top: 1.5rem;
            background-color: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .button:hover {
            background-color: var(--primary-hover);
        }

        .button:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }

        .rpc-status {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #6B7280;
        }

        .success { background-color: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
        .error { background-color: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
        .warning { background-color: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }

        .spinner {
            display: inline-block;
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Validación de Certificados</h1>
        <p>Sube el archivo PDF del certificado para verificar su autenticidad directamente en la blockchain de Polygon.</p>

        <div class="upload-area" id="uploadArea">
            <span class="upload-icon">📄</span>
            <span id="uploadText">Arrastra tu PDF aquí o haz clic para buscar</span>
            <input type="file" id="fileInput" accept="application/pdf">
        </div>

        <button class="button" id="verifyBtn" disabled>
            <span id="btnText">Verificar Certificado</span>
            <div class="spinner" id="spinner"></div>
        </button>

        <div id="result"></div>
        <div class="rpc-status" id="rpcStatus">Conectando a la red Polygon...</div>
    </div>

    <script src="js/ethers.umd.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
